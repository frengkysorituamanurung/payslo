          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    SnapshotSummary:
      type: object
      required: [name, savedAt, dataTables, sources]
      additionalProperties: false
      properties:
        name:
          type: string
        savedAt:
          type: string
          format: date-time
        dataTables:
          type: integer
          description: Jumlah tabel data dalam dump
        sources:
          type: object
          additionalProperties: true
          description: Profil tersimpan (banks, merchant, routing, release)
    SnapshotInfo:
      type: object
      required: [name, savedAt, dataTables, overwritten]
      additionalProperties: false
      properties:
        name:
          type: string
        savedAt:
          type: string
          format: date-time
        dataTables:
          type: integer
        overwritten:
          type: boolean
          description: true bila nama sudah ada dan ditimpa
    SnapshotList:
      type: object
      required: [snapshots]
      additionalProperties: false
      properties:
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotInfo'
    SnapshotLoadResult:
      type: object
      required: [name, restored]
      additionalProperties: false
      properties:
        name:
          type: string
        restored:
          type: array
          items:
            type: string
          description: Ringkasan per sumber yang ditimpa (db, bca, merchant, routing, release)
    MentorSessionInfo:
      type: object
      required: [scenarioId, startedAt, endedAt]
      additionalProperties: false
      properties:
        scenarioId:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: ['string', 'null']
          format: date-time
    MentorSessionList:
      type: object
      required: [sessions]
      additionalProperties: false
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/MentorSessionInfo'
    MentorSessionSummary:
      type: object
      required: [scenarioId, traineeName, startedAt, endedAt, ttdSecs, actionCount, answerCount, hintsUsed, actions, answers, assessment]
      additionalProperties: false
      properties:
        scenarioId:
          type: string
        traineeName:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: ['string', 'null']
          format: date-time
        ttdSecs:
          type: ['integer', 'null']
          description: Detik dari mulai sesi ke aksi pertama (null = belum ada)
        actionCount:
          type: integer
        answerCount:
          type: integer
        hintsUsed:
          type: integer
        actions:
          type: array
          items:
            type: object
            required: [ts, cmd, detail]
            additionalProperties: false
            properties:
              ts:
                type: string
                format: date-time
              cmd:
                type: string
              detail:
                type: string
        answers:
          type: object
          additionalProperties:
            type: string
          description: questionId -> jawaban
        assessment:
          $ref: '#/components/schemas/MentorAssessment'
    MentorAssessment:
      type: object
      required: [scenarioId]
      additionalProperties: false
      properties:
        scenarioId:
          type: string
        communicationScore:
          type: ['integer', 'null']
          minimum: 0
          maximum: 10
        communicationNote:
          type: string
        postmortemScore:
          type: ['integer', 'null']
          minimum: 0
          maximum: 10
        postmortemNote:
          type: string
        updatedAt:
          type: ['string', 'null']
          format: date-time
    MentorAssessmentPut:
      type: object
      additionalProperties: false
      properties:
        communicationScore:
          type: integer
          minimum: 0
          maximum: 10
        communicationNote:
          type: string
        postmortemScore:
          type: integer
          minimum: 0
          maximum: 10
        postmortemNote:
          type: string
    CurriculumModule:
      type: object
      required: [day, title, html, items]
      additionalProperties: false
      properties:
        day:
          type: string
          example: day-01
        title:
          type: string
        html:
          type: string
          description: HTML tersanitasi (tak ada HTML mentah; semua di-escape)
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
    ChecklistItem:
      type: object
      required: [key, label, section]
      additionalProperties: false
      properties:
        key:
          type: string
          example: aktivitas-1
        label:
          type: string
        section:
          type: string
          enum: [aktivitas, latihan]
    Curriculum:
      type: object
      required: [modules]
      additionalProperties: false
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/CurriculumModule'
    GlossaryTerm:
      type: object
      required: [term, definition]
      additionalProperties: false
      properties:
        term:
          type: string
        definition:
          type: string
    Glossary:
      type: object
      required: [terms]
      additionalProperties: false
      properties:
        terms:
          type: array
          items:
            $ref: '#/components/schemas/GlossaryTerm'
    LearnProgress:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LearnProgressItem'
    LearnProgressItem:
      type: object
      required: [module, key, done]
      additionalProperties: false
      properties:
        module:
          type: string
          example: day-01
        key:
          type: string
        done:
          type: boolean
    LearnProgressPut:
      type: object
      required: [module, key, done]
      additionalProperties: false
      properties:
        module:
          type: string
          example: day-01
        key:
          type: string
        done:
          type: boolean
  responses:
    Problem:
      description: RFC 9457 problem+json
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
