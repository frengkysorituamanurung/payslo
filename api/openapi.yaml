      responses:
        '200':
          description: Ringkasan sesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorSessionSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/mentor/assessment:
    get:
      operationId: getMentorAssessment
