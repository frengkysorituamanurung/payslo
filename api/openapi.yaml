# PaySLO Lab Console API — U4 (contract-first).
# Cakupan: U0 session/stack; U1 metrics/events; U2 payments/kontrol/audit;
# U3 SLO; U4 insiden/approval/runbook/postmortem/pengaturan. Endpoint lain
# (chaos, skenario, mentor) ditambahkan di fase UI berikutnya dengan
# mengubah file ini DULU.
openapi: 3.1.0
info:
  title: PaySLO Lab Console API
  version: 0.5.0
  license:
    name: Apache-2.0
  description: >-
    API lokal untuk Lab Console (lab serve, 127.0.0.1:8088). Semua uang integer
    IDR. Error memakai RFC 9457 (application/problem+json).
servers:
  - url: http://127.0.0.1:8088
    description: lab serve lokal
paths:
  /api/v1/session:
    get:
      operationId: getSession
      summary: Status sesi lab (mode, skenario aktif, stack up/belum)
      responses:
        '200':
          description: Sesi saat ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                traineeIdle:
                  value:
                    mode: trainee
                    traineeName: null
                    scenario: null
                    labUp: true
                    checkedAt: '2026-10-16T07:00:00Z'
                mentorActive:
                  value:
                    mode: mentor
                    traineeName: 'Sinta'
                    scenario:
                      id: '01'
                      title: 'VA timeout: bank-bca down'
                      startedAt: '2026-10-16T06:52:00Z'
                      elapsedSecs: 480
                    labUp: true
                    checkedAt: '2026-10-16T07:00:00Z'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/health/stack:
    get:
      operationId: getStackHealth
      summary: Kesehatan tiap service compose (untuk onboarding lab-belum-up)
      responses:
        '200':
          description: Status stack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackHealth'
              examples:
                up:
                  value:
                    labUp: true
                    checkedAt: '2026-10-16T07:00:00Z'
                    services:
                      - name: postgres
                        state: up
                      - name: gateway-api
                        state: up
                      - name: envoy
                        state: degraded
                        detail: admin tanpa healthcheck
                down:
                  value:
                    labUp: false
                    checkedAt: '2026-10-16T07:00:00Z'
                    services: []
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/metrics/summary:
    get:
      operationId: getMetricsSummary
      summary: Ringkasan metric bernama (satu nilai per nama + semantik data)
      parameters:
        - $ref: '#/components/parameters/WindowParam'
        - $ref: '#/components/parameters/DemoParam'
      responses:
        '200':
          description: Ringkasan metric
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSummary'
              examples:
                ok:
                  value:
                    checkedAt: '2026-10-16T07:00:00Z'
                    window: 5m
                    metrics:
                      http_2xx_ratio:
                        status: ok
                        value: 0.998
                        sampleRate: 2.1
                        lastDataAt: '2026-10-16T06:59:58Z'
                      payment_success_ratio:
                        status: ok
                        value: 0.983
                        sampleRate: 1.9
                        lastDataAt: '2026-10-16T06:59:55Z'
        '400':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/metrics/series:
    get:
      operationId: getMetricsSeries
      summary: Deret waktu satu metric bernama (grafik + tabel alternatif)
      parameters:
        - name: name
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MetricName'
        - name: provider
          in: query
          schema:
            $ref: '#/components/schemas/ProviderName'
          description: Wajib bila name=payment_success_ratio_by_provider.
        - $ref: '#/components/parameters/WindowParam'
        - name: step
          in: query
          schema:
            type: string
            enum: [5s, 15s, 1m]
            default: 15s
        - $ref: '#/components/parameters/DemoParam'
      responses:
        '200':
          description: Deret waktu (titik hilang = null, bukan 0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSeries'
        '400':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/events:
    get:
      operationId: streamEvents
      summary: SSE realtime (health + metrics); klien fallback polling bila putus
      parameters:
        - $ref: '#/components/parameters/DemoParam'
      responses:
        '200':
          description: text/event-stream; event bernama health|metrics + komentar ping
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: health\ndata: {\"labUp\":true}\n\n"
  /api/v1/payments:
    get:
      operationId: listPayments
      summary: Daftar transaksi (Postgres lab_ro, paginasi kursor, filter)
      description: >-
        Dibaca lewat role Postgres `lab_ro` (SELECT saja). Bila DB tak
        terjangkau, `dataStatus=source_down` dan `items` kosong (bukan 500).
      parameters:
        - $ref: '#/components/parameters/StatusParam'
        - $ref: '#/components/parameters/ProviderParam'
        - $ref: '#/components/parameters/ChannelParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/DemoParam'
      responses:
        '200':
          description: Satu halaman transaksi (terbaru dulu)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
              examples:
                ok:
                  value:
                    checkedAt: '2026-10-16T07:00:00Z'
                    dataStatus: ok
                    hasMore: false
                    nextCursor: null
                    items:
                      - id: '018f0a2e-1c3d-7a4b-8e5f-000000000001'
                        merchantId: merchant-demo
                        orderId: demo-order-1
                        channel: VA
                        provider: bca
                        amount: 150000
                        fee: 4000
                        status: PENDING
                        providerRef: P-BCA-0001
                        createdAt: '2026-10-16T06:59:00Z'
                        updatedAt: '2026-10-16T06:59:01Z'
                        expiresAt: '2026-10-16T07:09:00Z'
                        callbackCount: 0
                        webhookDelivered: false
                        duplicateCallback: false
        '400':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPayment
      summary: Kirim pembayaran uji (diteruskan ke gateway via Envoy)
      description: >-
        Validasi bentuk + rentang amount (integer IDR, 1..1000000000000)
        dilakukan di server SEBELUM memanggil gateway. HTTP 201 berarti
        diterima (P2), BUKAN sukses; status final tetap PENDING/FAILED dari bank.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Diterima gateway (status PENDING/FAILED; P2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /api/v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Detail transaksi + timeline (transactions, callback_log, webhook_delivery)
      parameters:
        - $ref: '#/components/parameters/PaymentIdParam'
      responses:
        '200':
          description: Detail + timeline (waktu nyata; langkah antara bisa derived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/payments/{id}/bank-status:
    get:
      operationId: getPaymentBankStatus
      summary: Cek status "ke bank" (GET bank-sim /status/{provider_ref})
      parameters:
        - $ref: '#/components/parameters/PaymentIdParam'
      responses:
        '200':
          description: Status versi bank-sim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatus'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/traffic:
    get:
      operationId: getTraffic
      summary: Laju loadgen saat ini (dibaca dari env kontainer loadgen)
      parameters:
        - $ref: '#/components/parameters/DemoParam'
      responses:
        '200':
          description: Laju saat ini (null + source=unknown bila tak terbaca)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficState'
    put:
      operationId: setTraffic
      summary: Ubah laju loadgen (docker compose up -d loadgen)
      description: 'Mutasi: wajib Origin UI + X-Lab-Token; tercatat di audit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrafficState'
      responses:
        '200':
          description: Laju baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficState'
        '400':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/routing:
    get:
      operationId: getRouting
      summary: Routing provider gateway (via admin loopback /admin/routing)
      responses:
        '200':
          description: Tabel routing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingConfig'
        '502':
          $ref: '#/components/responses/Problem'
    put:
      operationId: setRouting
      summary: Ganti tabel routing gateway (enable/disable + bobot)
      description: 'Mutasi: wajib Origin UI + X-Lab-Token; tercatat di audit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingConfig'
      responses:
        '200':
          description: Routing tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingConfig'
        '400':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/release:
    put:
      operationId: setRelease
      summary: Set versi rilis gateway (good|bad) untuk skenario regresi deploy
      description: 'Mutasi: wajib Origin UI + X-Lab-Token; tercatat di audit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseState'
      responses:
        '200':
          description: Versi rilis tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseState'
        '400':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Audit log mutasi lab serve (aktor, aksi, target, waktu)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Audit terbaru dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
  /api/v1/slos:
    get:
      operationId: listSlos
      summary: Daftar SLO dari payslo-workspace/slo (*.yml/*.yaml)
      description: >-
        Dibaca dari direktori slo workspace. Berkas yang tak terparse tetap
        dicantumkan dengan `parseError` (jujur, bukan disembunyikan).
      responses:
        '200':
          description: Daftar SLO + waktu cek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloList'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/slos/{name}:
    get:
      operationId: getSlo
      summary: Detail SLO (spesifikasi, deployment per backend, SLI live, budget, alert aktif)
      parameters:
        - $ref: '#/components/parameters/SloNameParam'
      responses:
        '200':
          description: Detail SLO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloDetail'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    put:
      operationId: saveSlo
      summary: Simpan berkas SLO (editor; hanya di payslo-workspace/slo/)
      description: >-
        Mutasi: wajib Origin UI + X-Lab-Token; tercatat di audit. Nama dibatasi
        slug/basename .yml/.yaml (traversal ditolak), ukuran maks 64 KiB.
      parameters:
        - $ref: '#/components/parameters/SloNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SloFilePut'
      responses:
        '200':
          description: Berkas tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloFileInfo'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/slos/{name}/validate:
    post:
      operationId: validateSlo
      summary: Validasi SLO (error berlokasi baris/kolom)
      description: >-
        Body opsional {content}: bila ada, validasi draf tanpa menyimpan;
        bila kosong, validasi berkas tersimpan. Selalu 200 dengan
        {valid, errors} (bukan 4xx untuk konten tak valid).
      parameters:
        - $ref: '#/components/parameters/SloNameParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SloValidateRequest'
      responses:
        '200':
          description: Hasil validasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloValidation'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/slos/{name}/plan:
    post:
      operationId: planSlo
      summary: Rencana perubahan per koneksi (diff untuk backend prometheus)
      description: >-
        Membungkus `payslo plan`. Untuk koneksi prometheus menyertakan
        desired/actual/diff; untuk datadog hanya flag perubahan + catatan
        (diff teks tak tersedia via CLI). Mutasi: wajib Origin + X-Lab-Token
        (tidak mengubah backend, tapi menjalankan subprocess).
      parameters:
        - $ref: '#/components/parameters/SloNameParam'
      responses:
        '200':
          description: Rencana perubahan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloPlan'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/slos/{name}/apply:
    post:
      operationId: applySlo
      summary: Terapkan SLO ke backend (idempoten; apply kedua = no-op)
      description: >-
        Membungkus `payslo apply`. Filter koneksi opsional via
        {connections}. Hasil per koneksi memuat applied/noOp; no-op
        ditampilkan jelas di UI. Tercatat di audit.
      parameters:
        - $ref: '#/components/parameters/SloNameParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SloApplyRequest'
      responses:
        '200':
          description: Hasil apply per koneksi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloApply'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/drift:
    get:
      operationId: getDrift
      summary: Drift backend vs apply terakhir (membungkus `payslo drift`)
      description: >-
        Mencakup SEMUA SLO di workspace (perilaku `payslo drift`: membaca
        direktori slo, bukan satu berkas).
      responses:
        '200':
          description: Daftar drift (kosong = bersih)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloDrift'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Matriks kapabilitas backend (membungkus `payslo capabilities`)
      responses:
        '200':
          description: Matriks fitur prometheus vs datadog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityMatrix'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/incidents:
    get:
      operationId: listIncidents
      summary: Daftar insiden dari payslo-server (filter status/slo/service)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, resolved]
        - name: slo
          in: query
          schema:
            type: string
        - name: service
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Daftar insiden terbaru dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentList'
        '400':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/incidents/{id}:
    get:
      operationId: getIncident
      summary: Detail insiden (timeline, alert terkorelasi, runbook, approvals)
      description: >-
        Semua data tak tepercaya (payload alert, catatan) dirender sebagai
        teks oleh UI; tidak ada HTML yang dieksekusi.
      parameters:
        - $ref: '#/components/parameters/IncidentIdParam'
      responses:
        '200':
          description: Detail insiden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '404':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/incidents/{id}/notes:
    post:
      operationId: addIncidentNote
      summary: Tambah catatan manual ke timeline insiden (aktor = X-Lab-Actor)
      description: 'Mutasi: wajib Origin UI + X-Lab-Token; tercatat di audit.'
      parameters:
        - $ref: '#/components/parameters/IncidentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentNotePut'
      responses:
        '201':
          description: Catatan tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [ok, incidentId]
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                  incidentId:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/incidents/{id}/approvals:
    get:
      operationId: listIncidentApprovals
      summary: Approval untuk satu insiden (filter status opsional)
      parameters:
        - $ref: '#/components/parameters/IncidentIdParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, expired]
      responses:
        '200':
          description: Daftar approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalList'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: requestApproval
      summary: Minta approval untuk langkah remediation runbook
      description: >-
        Aksi HARUS sama dengan langkah remediation di runbook (aksi bebas
        ditolak 400). Idempoten: request pending yang sama dikembalikan
        dengan deduped=true. Tercatat di audit.
      parameters:
        - $ref: '#/components/parameters/IncidentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequestPut'
      responses:
        '201':
          description: Approval dibuat (atau didedup)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalEnvelope'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/incidents/{id}/runbook/steps/{idx}/run:
    post:
      operationId: runDiagnosticStep
      summary: Jalankan SATU langkah diagnostic (output segar)
      description: >-
        Remediation -> 409 (wajib lewat approval PaySLO; tak ada jalan
        pintas); manual -> 400.
      parameters:
        - $ref: '#/components/parameters/IncidentIdParam'
        - name: idx
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Output langkah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepOutput'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/incidents/{id}/postmortem:
    get:
      operationId: getPostmortem
      summary: Draf postmortem + Markdown render server-side
      parameters:
        - $ref: '#/components/parameters/IncidentIdParam'
      responses:
        '200':
          description: Postmortem (exists=false bila belum pernah disimpan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Postmortem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: savePostmortem
      summary: Simpan postmortem (draft/published); tercatat di audit
      parameters:
        - $ref: '#/components/parameters/IncidentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostmortemPut'
      responses:
        '200':
          description: Postmortem tersimpan (dengan markdown ter-render)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Postmortem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/approvals:
    get:
      operationId: listApprovals
      summary: Antrean approval global (filter status, untuk badge + SSE)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, expired]
      responses:
        '200':
          description: Daftar approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalList'
        '400':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/approvals/{aid}/decision:
    post:
      operationId: decideApproval
      summary: Rekam keputusan approval ke PaySLO (identitas dari pengaturan)
      description: >-
        Approved -> lab serve mengeksekusi remediation lalu mencatat hasilnya
        di timeline. Keputusan ganda -> 409; reject tanpa reason -> 422.
        Tercatat di audit.
      parameters:
        - name: aid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionPut'
      responses:
        '200':
          description: Approval terputus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalEnvelope'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Pengaturan console (nama trainee untuk identitas approver)
      responses:
        '200':
          description: Pengaturan saat ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSettings'
    put:
      operationId: setSettings
      summary: Simpan pengaturan; tercatat di audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabSettings'
      responses:
        '200':
          description: Pengaturan tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSettings'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/observe/status:
    get:
      operationId: getObserveStatus
      summary: Status koneksi sumber observability + profil compose aktif
      description: >-
        Jujur per sumber: reachable=true/false + latencyMs. Profil compose
        (obs-full: loki/tempo/alloy) mati -> fitur log/trace dinonaktifkan
        dengan penjelasan (bukan error). Docker tidak tersedia -> field
        dockerAvailable=false (bukan 5xx).
      responses:
        '200':
          description: Status sumber observability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObserveStatus'
  /api/v1/observe/grafana:
    get:
      operationId: getGrafanaEmbed
      summary: Info embed Grafana (URL kiosk + daftar dashboard)
      responses:
        '200':
          description: Info embed Grafana
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrafanaEmbedInfo'
  /api/v1/observe/annotations:
    get:
      operationId: getAnnotations
      summary: Anotasi Grafana (deploy/chaos) — hanya yang boleh dilihat sesuai mode
      parameters:
        - name: from
          in: query
          schema:
            type: integer
            description: epoch detik (default 1 jam lalu)
        - name: to
          in: query
          schema:
            type: integer
            description: epoch detik (default sekarang)
      responses:
        '200':
          description: Anotasi (mode trainee hanya melihat yang bukan chaos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationList'
  /api/v1/observe/prometheus/alerts:
    get:
      operationId: getPrometheusAlerts
      summary: Alert aktif dari Prometheus (/api/v1/alerts)
      responses:
        '200':
          description: Alert aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusAlertList'
  /api/v1/observe/prometheus/rules:
    get:
      operationId: getPrometheusRules
      summary: Rules Prometheus (/api/v1/rules) milik payslo
      responses:
        '200':
          description: Grup rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusRuleList'
  /api/v1/observe/alertmanager:
    get:
      operationId: getAlertmanagerState
      summary: Alert Alertmanager + status suppressor
      responses:
        '200':
          description: Alert Alertmanager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertmanagerState'
  /api/v1/observe/ntfy/history:
    get:
