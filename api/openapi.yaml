  /api/v1/diagnostics:
    get:
      operationId: getDiagnostics
      summary: Laporan diagnostik (versi service, koneksi, resource) — BEBAS SECRET
      description: >-
        Tidak ada token/password/env sensitif (di-scan dengan pola di u7_test.go).
        Docker stats --no-stream bila tersedia; bila Docker tidak ada ->
        dockerAvailable=false + pesan jujur (bukan error).
      responses:
        '200':
          description: Laporan diagnostik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsReport'
  /api/v1/mentor/unlock:
    post:
      operationId: unlockMentor
      summary: Buka mode mentor dengan PIN (MENTOR_PIN)
      description: >-
        PEMBATAS SPOILER, bukan keamanan (lihat docs/mentor-guide.md). 5
        salah berurutan -> jeda 5 menit (429 + retryAfterSecs). Token mentor
        dikembalikan dan wajib dikirim sebagai header X-Mentor-Token pada
        endpoint /api/v1/mentor/* lainnya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorUnlock'
      responses:
        '200':
          description: Mode mentor aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorUnlockResult'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/mentor/lock:
    post:
      operationId: lockMentor
      summary: Keluar mode mentor (token dicabut di server)
      responses:
