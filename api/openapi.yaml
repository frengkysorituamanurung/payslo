      description: >-
        Mutasi: wajib Origin UI + X-Lab-Token + X-Mentor-Token; tercatat di
        audit. Bila secs diberikan, laju dikembalikan ke nilai semula setelah
        itu (best-effort, latar belakang).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorInjectTraffic'
      responses:
        '200':
          description: Laju baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficState'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/mentor/snapshots:
    get:
      operationId: listSnapshots
      summary: Daftar snapshot + ringkasan (untuk konfirmasi sebelum load)
      responses:
        '200':
          description: Daftar snapshot (terbaru dulu)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/mentor/snapshot/save:
    post:
      operationId: saveSnapshot
      summary: Simpan snapshot (DB data-only + profil chaos + routing + release)
      description: >-
        Mutasi: wajib Origin UI + X-Lab-Token + X-Mentor-Token; tercatat di
        audit. Menimpa nama yang sama (konfirmasi di UI).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotName'
      responses:
        '200':
          description: Snapshot tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/mentor/snapshot/load:
    post:
      operationId: loadSnapshot
      summary: Muat snapshot (timpa DB + profil chaos + routing + release)
      description: >-
        Mutasi: wajib Origin UI + X-Lab-Token + X-Mentor-Token; tercatat di
        audit. Mengembalikan ringkasan apa yang ditimpa (kondisi awal vs
        akhir per sumber).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotName'
      responses:
        '200':
          description: Snapshot dimuat; ringkasan penimpaan terlampir
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotLoadResult'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/mentor/sessions:
