            default: markdown
      responses:
        '200':
          description: Laporan (markdown = text/markdown; json = application/json)
          content:
            text/markdown:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/MentorSessionSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/learn/curriculum:
    get:
      operationId: getCurriculum
      summary: Kurikulum hari 1-5 (Markdown -> HTML tersanitasi server-side)
      description: >-
        HTML aman: SEMUA HTML mentah di-escape (tak ada <script>, iframe,
        event handler, atau URL javascript:). Link hanya http/https/mailto.
        Checklist per modul diambil dari daftar Aktivitas + Latihan.
      responses:
        '200':
          description: Modul kurikulum (HTML tersanitasi + checklist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curriculum'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/learn/glossary:
    get:
      operationId: getGlossary
      summary: Glosarium istilah SRE lab (SLI, SLO, error budget, dst.)
      responses:
        '200':
          description: Daftar istilah (terurut)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Glossary'
  /api/v1/learn/progress:
    get:
      operationId: getLearnProgress
      summary: Progres checklist trainee (SQLite lab serve; tahan restart)
      responses:
        '200':
          description: Peta module -> itemKey -> done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnProgress'
    put:
      operationId: putLearnProgress
      summary: Tandai checklist (tersimpan di SQLite lab serve)
      description: 'Mutasi: wajib Origin UI + X-Lab-Token; tercatat di audit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnProgressPut'
      responses:
        '200':
          description: Progres tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnProgress'
        '400':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    WindowParam:
      name: window
      in: query
      schema:
        type: string
        enum: [1m, 5m, 15m, 1h]
        default: 5m
    DemoParam:
      name: demo
      in: query
      description: Hanya mode --demo (healthy|bca_down|prom_down|empty|stale|payments). Mode live + param ini = 400.
      schema:
        $ref: '#/components/schemas/DemoScenario'
    PaymentIdParam:
      name: id
      in: path
      required: true
      description: UUID transaksi
      schema:
        type: string
        format: uuid
    StatusParam:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/PaymentStatus'
    ProviderParam:
      name: provider
      in: query
      schema:
        $ref: '#/components/schemas/ProviderName'
    ChannelParam:
      name: channel
      in: query
      schema:
        $ref: '#/components/schemas/PaymentChannel'
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CursorParam:
      name: cursor
      in: query
      description: 'Kursor opaque dari respons sebelumnya (keyset created_at+id).'
      schema:
        type: string
    SloNameParam:
      name: name
      in: path
      required: true
      description: Nama SLO (slug a-z0-9-, mis. payment-success-rate)
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
    IncidentIdParam:
      name: id
      in: path
      required: true
      description: ID insiden PaySLO (inc-<hex>)
      schema:
        type: string
  schemas:
    SessionMode:
      type: string
      enum: [trainee, mentor]
      example: trainee
    ScenarioRef:
      type: object
      required: [id, title, startedAt, elapsedSecs]
      additionalProperties: false
      properties:
        id:
          type: string
          example: '01'
        title:
          type: string
          example: 'VA timeout: bank-bca down'
        startedAt:
          type: string
          format: date-time
        elapsedSecs:
          type: integer
          minimum: 0
    Session:
      type: object
      required: [mode, traineeName, scenario, labUp, checkedAt]
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/SessionMode'
        traineeName:
          type: ['string', 'null']
        scenario:
          anyOf:
            - $ref: '#/components/schemas/ScenarioRef'
            - type: 'null'
        labUp:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    ServiceState:
      type: string
      enum: [up, down, degraded, unknown]
    ServiceHealth:
      type: object
      required: [name, state]
      additionalProperties: false
      properties:
        name:
          type: string
          example: gateway-api
        state:
          $ref: '#/components/schemas/ServiceState'
        detail:
          type: string
    StackHealth:
      type: object
      required: [labUp, services, checkedAt]
      additionalProperties: false
      properties:
        labUp:
          type: boolean
          description: false = tampilkan onboarding "lab belum up" + CopyCommand make up-lite
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceHealth'
        checkedAt:
          type: string
          format: date-time
    DataStatus:
      type: string
      description: Semantik data U1 (U1 di UI-SPEC). ok=segar; no_data=vektor kosong (bukan 0); stale=titik terakhir > 15 dtk; source_down=Prometheus tak terjangkau.
      enum: [ok, no_data, stale, source_down]
    MetricName:
      type: string
      enum: [http_rps, http_2xx_ratio, http_5xx_ratio, http_p99_ms, payment_rps, payment_success_ratio, payment_success_ratio_by_provider, payment_pending_stuck, webhook_delivery_ratio]
    ProviderName:
      type: string
      enum: [bca, mandiri, ewallet]
    DemoScenario:
      type: string
      enum: [healthy, bca_down, prom_down, empty, stale, payments]
    MetricValue:
      type: object
      required: [status, value, sampleRate, lastDataAt]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/DataStatus'
        value:
          type: ['number', 'null']
          description: null bila status bukan ok (jangan tampilkan 0)
        sampleRate:
          type: ['number', 'null']
          description: Laju sampel per detik (untuk ambang data-sedikit 0.2/s di UI)
        lastDataAt:
          type: ['string', 'null']
          format: date-time
        detail:
          type: string
    MetricsSummary:
      type: object
      required: [checkedAt, window, metrics]
      additionalProperties: false
      properties:
        checkedAt:
          type: string
          format: date-time
        window:
          type: string
          example: 5m
        metrics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetricValue'
    SeriesPoint:
      type: array
      prefixItems:
        - type: string
          format: date-time
          description: Waktu titik
        - type: ['number', 'null']
          description: Nilai; null = gap (jangan diinterpolasi diam-diam)
      minItems: 2
      maxItems: 2
    MetricsSeries:
      type: object
      required: [name, step, status, lastDataAt, points]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/MetricName'
        step:
          type: string
          example: 15s
        status:
          $ref: '#/components/schemas/DataStatus'
        lastDataAt:
          type: ['string', 'null']
          format: date-time
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    FieldError:
      type: object
      required: [field, message]
      additionalProperties: false
      properties:
        field:
          type: string
          example: amount
        message:
          type: string
          example: 'amount harus integer IDR antara 1 dan 1000000000000'
    PaymentChannel:
      type: string
      enum: [VA, EWALLET, QRIS]
    PaymentStatus:
      type: string
      enum: [CREATED, PENDING, SUCCESS, FAILED, EXPIRED]
    CreatePaymentRequest:
      type: object
      required: [merchantId, orderId, amount, channel]
      additionalProperties: false
      properties:
        merchantId:
          type: string
          minLength: 1
          example: merchant-demo
        orderId:
          type: string
          minLength: 1
          example: demo-order-1
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000000
          description: Integer IDR (tanpa pecahan). DILARANG float (U6/P7).
        channel:
          $ref: '#/components/schemas/PaymentChannel'
    PaymentSummary:
      type: object
      required:
        - id
        - merchantId
        - orderId
        - channel
        - provider
        - amount
        - fee
        - status
        - providerRef
        - createdAt
        - updatedAt
        - expiresAt
        - callbackCount
        - webhookDelivered
        - duplicateCallback
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        merchantId:
          type: string
        orderId:
          type: string
        channel:
          $ref: '#/components/schemas/PaymentChannel'
        provider:
          $ref: '#/components/schemas/ProviderName'
        amount:
          type: integer
          description: Integer IDR (tanpa pecahan)
        fee:
          type: integer
        status:
          $ref: '#/components/schemas/PaymentStatus'
        providerRef:
          type: ['string', 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        callbackCount:
          type: integer
          minimum: 0
        webhookDelivered:
          type: boolean
        duplicateCallback:
          type: boolean
          description: callbackCount > 1 (indikasi duplikat; netral, tanpa sebab)
    PaymentEventType:
      type: string
      enum: [created, pending, callback, webhook, final]
    PaymentEvent:
      type: object
      required: [type, at, derived]
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/PaymentEventType'
        at:
          type: ['string', 'null']
          format: date-time
          description: null = langkah turunan tanpa timestamp pasti (jangan dikarang)
        derived:
          type: boolean
        detail:
          type: ['string', 'null']
        provider:
          type: ['string', 'null']
        status:
          type: ['string', 'null']
        attempt:
          type: ['integer', 'null']
        httpStatus:
          type: ['integer', 'null']
    PaymentLinks:
      type: object
      description: >-
        Tautan observability bila tersedia (env LAB_LOKI_URL/LAB_TEMPO_URL);
        null = fitur belum aktif (obs-full belum dinyalakan), bukan error.
      required: [log, trace]
      additionalProperties: false
      properties:
        log:
          type: ['string', 'null']
        trace:
          type: ['string', 'null']
    PaymentDetail:
      type: object
      required:
        - payment
        - timeline
        - callbackCount
        - webhookCount
        - duplicateCallback
        - traceId
        - links
      additionalProperties: false
      properties:
        payment:
          $ref: '#/components/schemas/PaymentSummary'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/PaymentEvent'
        callbackCount:
          type: integer
          minimum: 0
        webhookCount:
          type: integer
          minimum: 0
        duplicateCallback:
          type: boolean
        traceId:
          type: ['string', 'null']
        links:
