# Publikasi image ber-tag versi ke GHCR untuk jalur `make up-prebuilt`.
#
# Pemicu: push tag v* (mis. v0.1.0). Tag image = NAMA TAG GIT (vX.Y.Z),
# DILARANG `latest` (aturan AGENTS.MD). Multi-arch linux/amd64+linux/arm64
# (binary musl statis dari Dockerfile workspace).
#
# Image yang dipublikasikan (5 target, sesuai docker-compose.prebuilt.yml):
#   <registry>/payslo-lab-gateway-api:<tag>
#   <registry>/payslo-lab-bank-sim:<tag>       (dipakai 3 instance)
#   <registry>/payslo-lab-merchant-sink:<tag>
#   <registry>/payslo-lab-payslo:<tag>
#   <registry>/payslo-lab-datadog-mock:<tag>
# dengan registry = ghcr.io/<repository_owner_lowercase>.
#
# Trainee memakai default upstream tanpa perubahan hanya bila registry-nya
# sama dengan default PAYSLO_REGISTRY di docker-compose.prebuilt.yml;
# fork WAJIB menimpa: PAYSLO_REGISTRY=ghcr.io/<org-anda> make up-prebuilt
# (lihat docs/VERSIONS.md).
#
# Provenance + SBOM attestations aktif (default build-push-action): setiap
# image membawa attestation yang bisa dicek via `docker buildx imagetools`.
#
# Job `console-binaries` (U8) juga mem-build binary `lab serve` (Lab Console,
# UI React tersemat) untuk 6 platform (linux/darwin/windows x amd64/arm64) dan
# mengunggahnya sebagai aset GitHub Release + checksums.txt.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish ${{ matrix.image }}:${{ github.ref_name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: gateway-api
            image: payslo-lab-gateway-api
          - target: bank-sim
            image: payslo-lab-bank-sim
          - target: merchant-sink
            image: payslo-lab-merchant-sink
          - target: payslo
            image: payslo-lab-payslo
          - target: datadog-mock
            image: payslo-lab-datadog-mock
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.2.0
      - uses: docker/setup-buildx-action@v3.8.0
      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner for GHCR
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build + push (amd64+arm64)
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  console-binaries:
    # U8: Lab Console (`lab serve`, Go + UI React tersemat) untuk 6 platform.
    # CGO_ENABLED=0 -> statis; tanpa toolchain Rust (hanya build UI + Go).
    name: console binaries (lab serve, UI embedded)
    runs-on: ubuntu-24.04
    permissions:
      contents: write # unggah aset ke GitHub Release
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: cmd/lab/go.mod
          cache-dependency-path: cmd/lab/go.sum
      - name: Install UI deps
        run: npm ci --no-audit --no-fund
        working-directory: ui
      - name: Build UI + embed ke Go
        run: make ui-build
      - name: Build + package (linux/darwin/windows x amd64/arm64)
        run: bash scripts/release-console.sh "${{ github.ref_name }}"
      - name: Checksums
        run: cd dist/console && sha256sum ./*.tar.gz ./*.zip > checksums.txt && cat checksums.txt
      - name: Publish assets ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/console/* --clobber
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: console-binaries
          path: dist/console
          retention-days: 7
