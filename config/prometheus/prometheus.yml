# Prometheus (FASE 2). Scrape 5s (kebutuhan lab: window pendek).
# rule_files menunjuk direktori hasil generate PaySLO (fase 3); mulai kosong —
# glob yang tidak cocok tidak masalah, Prometheus reload via /-/reload (lifecycle).
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/payslo/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: envoy
    static_configs:
      - targets: ["envoy:9901"]
    metrics_path: /stats/prometheus
  - job_name: sql-exporter
    static_configs:
      - targets: ["sql-exporter:9399"]
